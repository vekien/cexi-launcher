name: CatsEyeXI
game_slug: catseyexi
version: "2.2.168"
slug: catseyexi-wine
runner: wine
description: "CatsEyeXI Launcher — installs and manages the CatsEyeXI FFXI private server client."
script:
  files:
    - launcher:
        url: https://launcher.catseyexi.com/launcher/boot/CatsEyeXI-Launcher.exe?v=2.2.168
        filename: CatsEyeXI-Launcher.exe
    - updater:
        url: https://launcher.catseyexi.com/launcher/boot/CatsEyeXI-Updater.exe?v=2.2.168
        filename: CatsEyeXI-Updater.exe
    - appdll:
        url: https://launcher.catseyexi.com/launcher/boot/CatsEyeXI-Launcher.App.dll?v=2.2.168
        filename: CatsEyeXI-Launcher.App.dll
    - splash:
        url: https://launcher.catseyexi.com/launcher/boot/splash.png?v=2.2.168
        filename: splash.png
    - dep_vc2010:
        url: https://launcher.catseyexi.com/launcher/boot/deps/Microsoft%20Visual%20C%2B%2B%202010%20Redistributable.exe?v=2.2.168
        filename: Microsoft Visual C++ 2010 Redistributable.exe
    - dep_vc2012:
        url: https://launcher.catseyexi.com/launcher/boot/deps/Microsoft%20Visual%20C%2B%2B%202012%20Redistributable.exe?v=2.2.168
        filename: Microsoft Visual C++ 2012 Redistributable.exe
    - dep_vc2013:
        url: https://launcher.catseyexi.com/launcher/boot/deps/Microsoft%20Visual%20C%2B%2B%202013%20Redistributable.exe?v=2.2.168
        filename: Microsoft Visual C++ 2013 Redistributable.exe
    - dep_vc2015:
        url: https://launcher.catseyexi.com/launcher/boot/deps/Microsoft%20Visual%20C%2B%2B%202015%20Redistributable.exe?v=2.2.168
        filename: Microsoft Visual C++ 2015 Redistributable.exe
    - dep_dx:
        url: https://launcher.catseyexi.com/launcher/boot/deps/DirectX%20End-User%20Runtime.exe?v=2.2.168
        filename: DirectX End-User Runtime.exe
  game:
    exe: drive_c/CatsEyeXI/CatsEyeXI-Launcher.exe
    prefix: $GAMEDIR
  system:
    wine_version: GE-Proton10-34
  installer:
    - task:
        name: create_prefix
    - execute:
        command: mkdir -p $GAMEDIR/drive_c/CatsEyeXI
    - copy:
        src: $launcher
        dst: $GAMEDIR/drive_c/CatsEyeXI/
    - copy:
        src: $updater
        dst: $GAMEDIR/drive_c/CatsEyeXI/
    - copy:
        src: $appdll
        dst: $GAMEDIR/drive_c/CatsEyeXI/
    - copy:
        src: $splash
        dst: $GAMEDIR/drive_c/CatsEyeXI/
    - execute:
        command: mkdir -p $GAMEDIR/drive_c/CatsEyeXI/deps
    - copy:
        src: $dep_vc2010
        dst: $GAMEDIR/drive_c/CatsEyeXI/deps/
    - copy:
        src: $dep_vc2012
        dst: $GAMEDIR/drive_c/CatsEyeXI/deps/
    - copy:
        src: $dep_vc2013
        dst: $GAMEDIR/drive_c/CatsEyeXI/deps/
    - copy:
        src: $dep_vc2015
        dst: $GAMEDIR/drive_c/CatsEyeXI/deps/
    - copy:
        src: $dep_dx
        dst: $GAMEDIR/drive_c/CatsEyeXI/deps/